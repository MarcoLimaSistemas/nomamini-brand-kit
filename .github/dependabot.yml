version: 2
updates:
  # Dependências do Worker (wrangler)
  - package-ecosystem: npm
    directory: /infra/cloudflare/tracker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Actions do GitHub
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
