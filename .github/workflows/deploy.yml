name: Deploy (Cloudflare)

# Sobe o Worker e a LP. Roda só quando você dispara manualmente (workflow_dispatch)
# OU em push na main que mexa na infra — e SÓ se os secrets existirem.
# Configure em Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  (token com permissão de Workers + Pages + D1)
#   CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # não tenta deployar em fork/sem credencial
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — exige secrets configurados
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ausente — pulando deploy. Configure os secrets quando tiver a conta."
            exit 0
          fi

      - name: Deploy do Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare/tracker
          command: deploy

      - name: Deploy da LP (Pages)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare/pages
          command: pages deploy . --project-name noma-lp
